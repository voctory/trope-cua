name: Windows Driver Bug
description: Report a Windows UIA, HWND, AppBroadcast, or daemon issue
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before submitting a new issue, please search existing issues first. If one already covers the same problem, add a thumbs-up reaction instead of opening a duplicate.

        Do not include secrets, private window contents, tokens, or sensitive vulnerability details. For security issues, follow SECURITY.md instead of filing a public issue.
  - type: input
    id: version
    attributes:
      label: Trope CUA version or commit
      description: Use the released version, installer version, or `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `"$([Environment]::OSVersion | ForEach-Object VersionString) $(if ([Environment]::Is64BitOperatingSystem) { "x64" } else { "x86" })"` in PowerShell.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install or run mode
      options:
        - Installed package
        - Built from source
        - Published executable
        - Test harness
        - Other
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target application
      description: Include the app name, browser name, process name, or window title if known.
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool, route, or lane involved
      description: For example `click`, `type_text`, `capture_window`, `uia.invoke`, `hwnd.message`, `appbroadcast`, or `same_session`.
  - type: textarea
    id: actual
    attributes:
      label: What issue are you seeing?
      description: Include full error messages and structured receipts with private data redacted. Prefer text over screenshots.
    validations:
      required: true
  - type: textarea
    id: receipt
    attributes:
      label: Action receipt or structured output
      description: Include fields such as `route`, `lane`, `background_safe`, `cursor_moved`, `foreground_changed`, and `session` when available.
      render: json
  - type: textarea
    id: steps
    attributes:
      label: What steps can reproduce the bug?
      description: Include the exact MCP tool call, CLI command, target app setup, and any relevant test fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What is the expected behavior?
      description: Describe the expected route, receipt, focus behavior, cursor behavior, or output.
    validations:
      required: true
  - type: checkboxes
    id: regressions
    attributes:
      label: No-regression contract
      options:
        - label: The user's real cursor moved unexpectedly.
        - label: Foreground focus changed unexpectedly.
        - label: Input appeared in the wrong window or session.
        - label: The action reported success without a background-safe receipt.
  - type: textarea
    id: notes
    attributes:
      label: Additional information
      description: Add logs, screenshots, or hypotheses that help diagnose the issue.
