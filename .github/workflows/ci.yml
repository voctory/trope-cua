name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python test dependencies
        shell: pwsh
        run: python -m pip install pytest

      - name: Restore
        shell: pwsh
        run: dotnet restore trope-cua.sln --locked-mode

      - name: Check formatting
        shell: pwsh
        run: dotnet format --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        shell: pwsh
        run: dotnet build trope-cua.sln --no-restore

      - name: Audit packages
        shell: pwsh
        run: dotnet list trope-cua.sln package --vulnerable --include-transitive

      - name: Test
        shell: pwsh
        run: scripts\run-tests.ps1

  macos:
    name: macOS
    runs-on: macos-15

    defaults:
      run:
        working-directory: native/macos/trope-cua

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test
